# SPA fallback: React Router handles routes like /runs/xyz client-side, but a direct
# navigation or page refresh hits nginx first with that exact path, which isn't a real file.
# try_files serves a real static asset when one exists (JS/CSS/images), then falls back to
# index.html for everything else so React Router can render the right thing client-side —
# including a 404 UI state when the id in the URL doesn't actually exist (that's an API-level
# 404 the app renders, not something nginx can know about upfront).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
