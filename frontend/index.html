<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MAVERIK</title>
    <script>
      // Set the theme before first paint so there's no flash of the default theme on reload —
      // must stay in sync with THEME_STORAGE_KEY/THEMES in src/hooks/useTheme.js.
      (function () {
        try {
          var known = ["spacemacs", "terminal-clay", "ops-console", "ledger"];
          var stored = localStorage.getItem("maverik-theme");
          document.documentElement.dataset.theme = known.indexOf(stored) !== -1 ? stored : "spacemacs";
        } catch (e) {
          document.documentElement.dataset.theme = "spacemacs";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
