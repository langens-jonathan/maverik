<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MAVERIK</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Set the theme before first paint so there's no flash of the default theme on reload —
      // must stay in sync with THEME_STORAGE_KEY/THEMES in src/hooks/useTheme.js.
      (function () {
        try {
          var known = ["ops-console", "spacemacs", "terminal-clay", "ledger"];
          var stored = localStorage.getItem("maverik-theme");
          document.documentElement.dataset.theme = known.indexOf(stored) !== -1 ? stored : "ops-console";
        } catch (e) {
          document.documentElement.dataset.theme = "ops-console";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
